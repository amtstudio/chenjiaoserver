services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chenjiao
      MYSQL_USER: chenjiao
      MYSQL_PASSWORD: chenjiao
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: chenjiao
      DB_PASSWORD: chenjiao
      DB_NAME: chenjiao
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "2684:2684"

volumes:
  dbdata: